name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: peer/go.mod

      - name: Ensure formatting
        run: make lint

      - name: Unit tests
        run: make test

      - name: Race tests
        run: make test-race

      - name: Static checks
        run: make vet

      - name: Build ARM64 artifact
        run: make build-arm64

      - name: Smoke test node mode
        run: make smoke

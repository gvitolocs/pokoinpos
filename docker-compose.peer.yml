services:
  pokoinpos-peer:
    image: ${POKOINPOS_IMAGE:-newisdom/pokoinpos-peer:latest}
    container_name: ${PEER_NAME:-pokoinpos-peer}
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=${POKOINPOS_AUTO_UPDATE:-true}"
    environment:
      POKOINPOS_RUN_MODE: node
      POKOINPOS_LISTEN_PORT: ${POKOINPOS_LISTEN_PORT:-43000}
      POKOINPOS_ADVERTISE_HOST: ${POKOINPOS_ADVERTISE_HOST:-127.0.0.1}
      POKOINPOS_OPS_ADDR: :8080
      POKOINPOS_BOOTSTRAP_PEERS: ${POKOINPOS_BOOTSTRAP_PEERS:-}
      POKOINPOS_BOOTSTRAP_MANIFEST_URL: ${POKOINPOS_BOOTSTRAP_MANIFEST_URL:-https://pokoin.com/bootstrap-peers.json}
      POKOINPOS_BOOTSTRAP_REFRESH_INTERVAL_HOURS: ${POKOINPOS_BOOTSTRAP_REFRESH_INTERVAL_HOURS:-}
      POKOINPOS_JOIN_HOST: ${POKOINPOS_JOIN_HOST:-}
      POKOINPOS_JOIN_PORT: ${POKOINPOS_JOIN_PORT:-}
      POKOINPOS_OPERATOR_TOKEN: ${POKOINPOS_OPERATOR_TOKEN:-${POKOINPOS_ADMIN_TOKEN:-}}
      POKOINPOS_REWARD_PAYOUT_ADDRESS: ${POKOINPOS_REWARD_PAYOUT_ADDRESS:-}
      POKOINPOS_SLOT_SECONDS: ${POKOINPOS_SLOT_SECONDS:-1}
      POKOINPOS_IDLE_SLOT_INTERVAL: ${POKOINPOS_IDLE_SLOT_INTERVAL:-300}
      POKOINPOS_BASE_MINE_ATTEMPTS_PER_TICK: ${POKOINPOS_BASE_MINE_ATTEMPTS_PER_TICK:-1}
      POKOINPOS_MAX_MINE_ATTEMPTS_PER_TICK: ${POKOINPOS_MAX_MINE_ATTEMPTS_PER_TICK:-5}
      POKOINPOS_MINE_ATTEMPTS_PER_PENDING_TX: ${POKOINPOS_MINE_ATTEMPTS_PER_PENDING_TX:-1}
      POKOINPOS_GENESIS_HARDNESS: ${POKOINPOS_GENESIS_HARDNESS:-10000}
      POKOINPOS_GENESIS_SEED: ${POKOINPOS_GENESIS_SEED:-42}
      POKOINPOS_INITIAL_BALANCE: ${POKOINPOS_INITIAL_BALANCE:-1000000}
      POKOINPOS_FINALITY_DEPTH: ${POKOINPOS_FINALITY_DEPTH:-1}
      POKOINPOS_EVM_CHAIN_ID: ${POKOINPOS_EVM_CHAIN_ID:-}
      POKOINPOS_EVM_NETWORK_ID: ${POKOINPOS_EVM_NETWORK_ID:-}
      POKOINPOS_EVM_GENESIS_ALLOC: ${POKOINPOS_EVM_GENESIS_ALLOC:-}
      POKOINPOS_STATE_DIR: /data
      POKOINPOS_STATE_SAVE_INTERVAL_SECONDS: ${POKOINPOS_STATE_SAVE_INTERVAL_SECONDS:-15}
      POKOINPOS_RECONNECT_INTERVAL_SECONDS: ${POKOINPOS_RECONNECT_INTERVAL_SECONDS:-5}
    ports:
      - "${POKOINPOS_LISTEN_PORT:-43000}:${POKOINPOS_LISTEN_PORT:-43000}"
      - "${POKOINPOS_OPS_PORT:-8080}:8080"
    volumes:
      - "${POKOINPOS_STATE_HOST_PATH:-./.pokoinpos-state}:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  pokoinpos-updater:
    image: containrrr/watchtower:latest
    container_name: ${PEER_NAME:-pokoinpos-peer}-updater
    restart: unless-stopped
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=${POKOINPOS_UPDATE_INTERVAL_SECONDS:-60}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - ${PEER_NAME:-pokoinpos-peer}
